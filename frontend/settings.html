<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lollipop</title>
<style>
  /* Standard controls (checkbox, select, range, number, button) in the OS theme and accent color; the page only lays
     them out: navigation on the left, one row per setting. The window backdrop (Mica, macOS vibrancy) shows through
     the transparent body; without it (Windows 10) the body gets a solid color. */
  :root {
    color-scheme: light dark;
    --accent: #005fb8; --text2: rgba(0, 0, 0, .62); --card: rgba(255, 255, 255, .7); --card-border: rgba(0, 0, 0, .06);
    --hover: rgba(0, 0, 0, .05); --solid: #f3f3f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #60cdff; --text2: rgba(255, 255, 255, .72); --card: rgba(255, 255, 255, .05); --card-border: rgba(0, 0, 0, .2);
      --hover: rgba(255, 255, 255, .06); --solid: #202020;
    }
  }
  @supports (color: -apple-system-control-accent) { :root { --accent: -apple-system-control-accent; } }
  html, body { margin: 0; height: 100%; background: transparent; }
  body.solid { background: var(--solid); }
  body { display: flex; font: 14px "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
    user-select: none; cursor: default; accent-color: var(--accent); }
  nav { width: 200px; flex: none; padding: 12px 8px; box-sizing: border-box; }
  nav .app { display: flex; align-items: center; gap: 10px; padding: 4px 12px 16px; font-weight: 600; }
  nav .app svg { width: 28px; height: 28px; }
  nav button { display: block; position: relative; width: 100%; text-align: left; font: inherit; color: inherit;
    background: none; border: 0; border-radius: 4px; padding: 9px 14px; margin-bottom: 2px; }
  nav button:hover, nav button.sel { background: var(--hover); }
  nav button.sel::before { content: ""; position: absolute; left: 0; top: 50%; width: 3px; height: 16px;
    margin-top: -8px; border-radius: 2px; background: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 12px 24px 24px 8px; }
  h1 { font-size: 28px; font-weight: 600; margin: 8px 0 20px; }
  h2 { font-size: 14px; font-weight: 600; margin: 4px 0 8px; }
  .row { display: flex; align-items: center; gap: 16px; min-height: 36px; padding: 10px 16px; margin-bottom: 4px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 6px; }
  .row > label, .row > .label { flex: 1; }
  .row.sub { margin-left: 32px; }
  .row.off { opacity: .45; }
  select, button, input { font: inherit; }
  select { min-width: 180px; }
  input[type=checkbox] { width: 18px; height: 18px; margin: 0; }
  input[type=number] { width: 64px; }
  input[type=range] { width: 180px; }
  .range { display: flex; align-items: center; gap: 10px; }
  .range output { min-width: 56px; text-align: right; color: var(--text2); }
  .status { font-weight: 600; }
  .status.ok { color: #0f7b0f; } .status.broken, .status.invalid { color: #c42b1c; }
  @media (prefers-color-scheme: dark) { .status.ok { color: #6ccb5f; } .status.broken, .status.invalid { color: #ff99a4; } }
  .note { color: var(--text2); line-height: 1.45; margin: 4px 2px 12px; }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  code { font: 12px Consolas, ui-monospace, monospace; }
  a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script type="module">
import * as wails from "/wails/runtime.js";

document.addEventListener("contextmenu", e => e.preventDefault());

const nav = document.getElementById("nav"), main = document.getElementById("main");
let s = null, st = { claude: "absent", autostart: false, version: "" }, lang = "", page = "look", lastDone = 3, ids = 0;
const t = ([en, it]) => lang === "it" ? it : en;
const send = (key, value) => wails.Events.Emit("setting", { key, value });

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids.filter(k => k != null));
  return e;
}

// One setting: its label (tied to the control, so clicking it toggles a checkbox) and the control on the right.
function row(label, control, cls = "") {
  const input = control.matches("input, select") ? control : control.querySelector("input");
  input.id ||= "c" + ++ids;
  return el("div", { className: "row " + cls },
    el("label", { htmlFor: input.id }, t(label)), control);
}

function select(key, options) {
  const sel = el("select", { onchange: () => send(key, typeof s[key] === "number" ? Number(sel.value) : sel.value) },
    ...options.map(([v, label]) => el("option", { value: v, textContent: t(label) })));
  sel.value = s[key];
  return sel;
}

const check = (checked, onchange) => { const c = el("input", { type: "checkbox", checked }); c.onchange = () => onchange(c.checked); return c; };
const flag = key => check(s[key], v => send(key, v));

// A slider with its value next to it; the setting changes when it is released. reverse: higher to the left.
function slider(key, min, max, step, format, reverse = false) {
  const val = v => reverse ? min + max - v : v;
  const r = el("input", { type: "range", min, max, step, value: val(s[key]) });
  const out = el("output", {}, format(s[key]));
  r.oninput = () => { out.textContent = format(val(Number(r.value))); };
  r.onchange = () => send(key, val(Number(r.value)));
  return el("div", { className: "range" }, r, out);
}

const pages = {
  look: [["Appearance", "Aspetto"], () => [
    row(["Shape", "Forma"], select("shape", [["rect", ["Rectangle", "Rettangolo"]], ["pill", ["Pill", "Capsula"]]])),
    row(["Indicator", "Indicatore"], select("marker", [["dot", ["Dot", "Pallino"]], ["lollipop", ["Lollipop", "Lollipop"]]])),
    row(["Size", "Dimensione"], slider("scale", 70, 160, 5, v => v + "%")),
    row(["Blinking speed", "Velocità del lampeggio"], slider("blinkMs", 200, 1500, 50, v => v + " ms", true)),
    row(["Compact view", "Vista compatta"], flag("compact")),
  ]],
  entries: [["Entries", "Voci"], () => {
    const collapse = s.doneMax >= 0;
    const n = el("input", { type: "number", min: 0, max: 99, value: collapse ? s.doneMax : lastDone, disabled: !collapse });
    n.onchange = () => { lastDone = Math.max(0, Math.min(99, Math.round(Number(n.value) || 0))); send("doneMax", lastDone); };
    return [
      row(["Order", "Ordine"], select("order", [["alpha", ["Alphabetical", "Alfabetico"]], ["recent", ["Last activity", "Ultima attività"]]])),
      row(["Most important entries", "Voci più importanti"], select("side", [["right", ["On the right", "A destra"]], ["left", ["On the left", "A sinistra"]]])),
      row(["Group by state", "Raggruppa per stato"], flag("groupByState")),
      row(["Collapse idle agents", "Raccogli gli agenti idle"], check(collapse, v => send("doneMax", v ? lastDone : -1))),
      row(["Keep visible", "Lasciane visibili"], n, "sub" + (collapse ? "" : " off")),
    ];
  }],
  general: [["General", "Generale"], () => [
    row(["Always on top", "Sempre in primo piano"], flag("alwaysOnTop")),
    row(["Show window", "Mostra finestra"], flag("showWindow")),
    row(["Start lollipop at login", "Avvia lollipop all'accesso"], check(st.autostart, v => wails.Events.Emit("autostart", v))),
    row(["Language / Lingua", "Lingua / Language"],
      select("lang", [["auto", ["Automatic (system)", "Automatica (sistema)"]], ["en", ["English", "English"]], ["it", ["Italiano", "Italiano"]]])),
  ]],
  integrations: [["Integrations", "Integrazioni"], () => {
    const label = { ok: ["Active", "Attiva"], broken: ["Needs repair", "Da riparare"], invalid: ["settings.json is not valid", "settings.json non valido"],
      absent: ["Not installed", "Non installata"] }[st.claude];
    return [
      el("h2", {}, "Claude Code"),
      el("div", { className: "note" }, t(["lollipop adds a hook to ", "lollipop aggiunge un hook a "]),
        el("a", { textContent: st.claudeSettings || "settings.json", onclick: () => wails.Events.Emit("open-claude-settings") }), "."),
      el("div", { className: "row" }, el("span", { className: "label" }, t(["Integration", "Integrazione"])),
        el("span", { className: "status " + st.claude, textContent: t(label) })),
      el("div", { className: "btns" },
        el("button", { disabled: st.claude === "invalid", onclick: () => wails.Events.Emit("claude", "install"),
          textContent: t(st.claude === "absent" ? ["Install", "Installa"] : ["Repair", "Ripara"]) }),
        el("button", { disabled: st.claude !== "ok" && st.claude !== "broken", onclick: () => wails.Events.Emit("claude", "remove"),
          textContent: t(["Remove", "Rimuovi"]) })),
    ];
  }],
  about: [["About", "Informazioni"], () => [
    el("div", { className: "row" }, el("span", { className: "label" }, t(["Version", "Versione"])), el("span", {}, st.version)),
    el("div", { className: "row" }, el("span", { className: "label" }, t(["Source code", "Codice sorgente"])),
      el("a", { textContent: "github.com/antoniointrieri/lollipop", onclick: () => wails.Events.Emit("open-repo") })),
    el("div", { className: "row" }, el("span", { className: "label" }, t(["License", "Licenza"])), el("span", {}, "MIT")),
  ]],
};

// Head of the lollipop, as in the bar.
const logo = (() => {
  const end = 4 * Math.PI, b = (10 - 0.9 - 0.85) / end, pts = [];
  for (let phi = 0; phi <= end + 1e-9; phi += 0.15) pts.push(`${(10 + b * phi * Math.cos(phi)).toFixed(2)},${(10 + b * phi * Math.sin(phi)).toFixed(2)}`);
  return `<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="#e00"/><polyline points="${pts.join(" ")}" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>`;
})();

function render() {
  if (!s || document.activeElement?.type === "number") return; // keep typing in the number field
  const app = el("div", { className: "app" }, "lollipop");
  app.insertAdjacentHTML("afterbegin", logo);
  nav.replaceChildren(app, ...Object.entries(pages).map(([id, [title]]) =>
    el("button", { className: id === page ? "sel" : "", textContent: t(title), onclick: () => { page = id; render(); } })));
  const [title, body] = pages[page];
  main.replaceChildren(el("h1", {}, t(title)), ...body());
}

wails.Events.On("settings", e => {
  s = e.data;
  lang = s.uiLang;
  if (s.doneMax >= 0) lastDone = s.doneMax;
  render();
});
wails.Events.On("status", e => {
  st = e.data;
  document.body.classList.toggle("solid", !st.translucent);
  const [light, dark] = st.accent || [];
  const accent = matchMedia("(prefers-color-scheme: dark)").matches ? dark : light;
  if (accent) document.documentElement.style.setProperty("--accent", accent);
  render();
});
wails.Events.Emit("settings-ready");
</script>
</body>
</html>
