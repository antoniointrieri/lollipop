<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>lollipop</title>
<style>
  /* sizes in rem: the Size setting only scales the root font-size */
  html { font-size: calc(11pt * var(--scale, 1)); }
  html, body { margin: 0; background: #202024; overflow: hidden; user-select: none; cursor: default; }
  body { font: bold 1rem "Segoe UI", -apple-system, sans-serif; --custom-contextmenu: main; }
  #bar { display: flex; align-items: center; gap: 0.25rem; width: max-content; padding: 0.2rem; white-space: nowrap; }
  #grip { color: gray; font-size: 1.45rem; font-weight: normal; padding: 0 0.1rem; cursor: move; --wails-draggable: drag; }
  #list { display: flex; gap: 0.25rem; }
  .a { display: flex; gap: 0.2rem; padding: 0.1rem 0.45rem; border-radius: 3px; background: #3a3a42; cursor: pointer; }
  .pill .a { border-radius: 999px; }
  .compact .name { display: none; }
  /* compact: square entry (circle when pill) with a CSS-drawn dot, which centers exactly unlike the glyph */
  .compact .a { width: 1.5rem; height: 1.5rem; padding: 0; justify-content: center; align-items: center; }
  .compact .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: currentColor; font-size: 0; }
  .a.pressed { background: #5a5a6a; }
  .empty { font-size: 1.65rem; }
  /* lollipop marker: inline SVG, the head takes the entry color */
  .dot.lp, .empty.lp { align-self: center; font-size: 0; }
  .dot.lp svg { display: block; width: 1rem; height: 1rem; }
  .empty.lp svg { display: block; width: 1.15rem; height: 1.15rem; }
  .compact .dot.lp { width: auto; height: auto; background: none; border-radius: 0; }
  .dim { filter: brightness(0.4); }
  /* "⋯": the idle entries beyond the chosen number, listed vertically on mouseover */
  #wrap { display: flex; flex-direction: column; align-items: flex-end; width: max-content; }
  #wrap.up { flex-direction: column-reverse; }
  #bar { align-self: flex-end; } /* the right edge stays still */
  /* the list hangs under (or over) the "⋯", which sits at the less important end */
  #pop { display: none; flex-direction: column; align-self: flex-start; align-items: flex-start; gap: 0.25rem;
    padding: 0 0.2rem 0.2rem; overflow-y: auto; }
  .side-left #pop { align-self: flex-end; align-items: flex-end; }
  #wrap.up #pop { padding: 0.2rem 0.2rem 0; }
  #pop.open { display: flex; }
  .a.more { color: gray; }
  .compact .a.more { width: auto; padding: 0 0.4rem; }
</style>
</head>
<body>
<div id="wrap"><div id="bar"><span id="grip">⋮</span><span id="list"></span></div><div id="pop"></div></div>
<script type="module">
import * as wails from "/wails/runtime.js";

const colors = { working: [255, 215, 0], done: [50, 205, 50], monitoring: [0, 191, 255] };
const rgb = state => `rgb(${colors[state] || [255, 0, 0]})`;
// a darker yellow under the lollipop's white spiral, which would barely show on the plain one
const headColor = state => state === "working" ? "rgb(230,176,0)" : rgb(state);
const $ = id => document.getElementById(id), list = $("list"), bar = $("bar"), pop = $("pop"), wrap = $("wrap");
let dots = [], pressedKey = null, phase = false, last = { items: [], error: "" }, blinkTimer, lang = "en", lollipop = false;
// While the mouse is over the window the entries don't move (frozen: keys and "⋯" membership as on screen).
let frozen = [], popOpen = false, popTimer, side = "right";
const text = (en, it) => lang === "it" ? it : en;

function span(cls, text) { const s = document.createElement("span"); s.className = cls; s.textContent = text; return s; }

// Head of radius 10 in the current color with a white Archimedean spiral of 2 turns (same idea as the tray icon).
const lollipopSVG = (() => {
  const stroke = 1.7, end = 4 * Math.PI, b = (10 - 0.9 - stroke / 2) / end, pts = [];
  for (let phi = 0; phi <= end + 1e-9; phi += 0.15) {
    pts.push(`${(10 + b * phi * Math.cos(phi)).toFixed(2)},${(10 + b * phi * Math.sin(phi)).toFixed(2)}`);
  }
  return `<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="10" fill="currentColor"/><polyline points="${pts.join(" ")}" ` +
    `fill="none" stroke="#fff" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
})();

function marker(cls, color) {
  const m = span(cls + (lollipop ? " lp" : ""), lollipop ? "" : "●");
  if (lollipop) m.innerHTML = lollipopSVG;
  m.style.color = color;
  return m;
}

function entry(it) {
  const a = span("a" + (it.key === pressedKey ? " pressed" : ""), "");
  const dot = marker("dot", lollipop ? headColor(it.state) : rgb(it.state)), name = span("name", it.label);
  a.title = it.tip;
  a.style.color = rgb(it.state);
  a.onclick = () => click(it, a);
  a.append(dot, name);
  dots.push({ it, dot });
  return a;
}

// Fresh data in the order on screen. An entry leaves the "⋯" as soon as it needs attention; new agents go to the
// less important end.
function keepOrder(items) {
  const byKey = new Map(items.map(it => [it.key, it])), known = new Set(frozen.map(f => f.key));
  const kept = frozen.filter(f => byKey.has(f.key)).map(f => ({ ...byKey.get(f.key), more: f.more && byKey.get(f.key).more }));
  const added = items.filter(it => !known.has(it.key));
  return side === "left" ? [...kept, ...added] : [...added, ...kept];
}

function render(msg) {
  last = msg;
  // the browser's own :hover, which clears when the pointer leaves the window even if no event says so
  const hover = document.documentElement.matches(":hover");
  const error = msg.error, items = hover ? keepOrder(msg.items) : msg.items;
  frozen = items.map(it => ({ key: it.key, more: it.more }));
  list.replaceChildren();
  pop.replaceChildren();
  dots = [];
  if (!items.length) {
    const d = marker("empty", error ? "rgb(255,0,0)" : "dimgray");
    d.title = error ? text("Error: ", "Errore: ") + error : text("No active agents", "Nessun agente attivo");
    list.append(d);
  }
  const hidden = items.filter(it => it.more);
  if (hidden.length) {
    const m = span("a more", "⋯ " + hidden.length);
    m.title = text(`${hidden.length} more done agents`, `Altri ${hidden.length} agenti done`);
    m.onmouseenter = m.onclick = openPop;
    m.onmouseleave = closeSoon;
    pop.append(...hidden.map(entry));
    list.append(m); // at the less important end
  } else {
    popOpen = false;
  }
  const shown = items.filter(it => !it.more).map(entry);
  if (side === "left") list.prepend(...shown); else list.append(...shown);
  pop.classList.toggle("open", popOpen);
  report();
}

function report() {
  const r = wrap.getBoundingClientRect();
  wails.Events.Emit("size", { w: Math.ceil(r.width), h: Math.ceil(r.height), bar: Math.ceil(bar.getBoundingClientRect().height),
    up: wrap.classList.contains("up") });
}

// The list opens toward the larger half of the screen; while it is closed the window top is the bar top.
// ponytail: screenY/availTop not yet verified with several monitors nor on macOS
function openPop() {
  clearTimeout(popTimer);
  if (popOpen) return;
  const top = window.screenY - (screen.availTop || 0), h = bar.getBoundingClientRect().height;
  const up = top + h / 2 > screen.availHeight / 2;
  wrap.classList.toggle("up", up);
  pop.style.maxHeight = Math.max(0, (up ? top : screen.availHeight - top - h) - 8) + "px";
  popOpen = true;
  pop.classList.add("open");
  report();
}

function closeSoon() { clearTimeout(popTimer); popTimer = setTimeout(closePop, 300); }

function closePop() {
  clearTimeout(popTimer);
  if (!popOpen) return;
  popOpen = false;
  pop.classList.remove("open");
  report();
}

pop.onmouseenter = () => clearTimeout(popTimer);
pop.onmouseleave = closeSoon;
document.addEventListener("mouseout", e => {
  if (e.relatedTarget) return; // still inside the window
  closePop();
  setTimeout(() => render(last), 50); // apply the order held while the mouse was over, once :hover has cleared
});

// Highlight for 500 ms; repeated clicks in that window are ignored.
function click(it, a) {
  if (pressedKey) return;
  pressedKey = it.key;
  a.classList.add("pressed");
  it.blink = false;
  setTimeout(() => { pressedKey = null; document.querySelectorAll(".pressed").forEach(e => e.classList.remove("pressed")); }, 500);
  wails.Events.Emit("focus", { key: it.key, handle: it.handle });
}

function applySettings(s) {
  lang = s.uiLang;
  document.body.classList.toggle("pill", s.shape === "pill");
  document.body.classList.toggle("compact", s.compact);
  lollipop = s.marker === "lollipop";
  side = s.side;
  document.body.classList.toggle("side-left", side === "left");
  document.documentElement.style.setProperty("--scale", s.scale / 100);
  clearInterval(blinkTimer);
  // blinking alternates the marker with a 40% version of it (spiral included)
  blinkTimer = setInterval(() => {
    phase = !phase;
    for (const { it, dot } of dots) dot.classList.toggle("dim", phase && it.blink);
  }, s.blinkMs);
  render(last); // re-render to report the new size
}

wails.Events.On("agents", e => render(e.data));
wails.Events.On("settings", e => applySettings(e.data));
wails.Events.Emit("ready");
</script>
</body>
</html>
